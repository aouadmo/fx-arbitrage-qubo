[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxqubo"
version = "0.1.0"
description = "Currency-cycle arbitrage as a QUBO, benchmarked against classical algorithms on public ECB rates"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohamed Aouad" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
